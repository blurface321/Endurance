<div class="container">
    <div class="_2-col-grid">
        <div class="gradient-card" appFade [threshold]="0.5">
            <div class="card-content">
                <div class="text-header">
                    <p>Unlock weekly recaps</p>
                    <p>Your wellness, summarized daily—stay in touch with your body.</p>
                </div>
            </div>
            <div class="overlay-gradient">
                <div class="svg-container formation">
                    <img class="svg main-svg" src="../../assets/svg_icons/WeeklyRecap.svg" alt="">
                    <img src="../../assets/svg_icons/WeeklyStats.svg" alt="" class="svg corner-svg">
                </div>
            </div>
        </div>
        <div class="gradient-card" appFade [threshold]="0.5">
            <div class="card-content">
                <div class="text-header">
                    <p>Get daily insights</p>
                    <p>Get clear answers and tailored insights on your sleep impact, gut, and progress—in seconds.</p>
                </div>
                <div class="svg-container animation">
                    <img #svgEl class="svg" [alt]="miniCards[currentIndex].alt">
                </div>
            </div>
            <div class="overlay-gradient"></div>
        </div>
    </div>
</div>
