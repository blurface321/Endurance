<section class="ask-ai">
    <div class="header-section">
        <h1 class="hero-title">
            <span class="italic-accent">Ask</span> Endurance anything
        </h1>
        <p class="hero-subtitle">
            Get the answers you need to get clarity and make better health decisions.
        </p>
    </div>
    <!-- <div class="screen-center"> -->
        <!-- <div class="placeholder-svg">
            <img src="../../../assets/svg_icons/AskAIAnything.svg" alt="">
        </div> -->
    <!-- </div> -->
    <div class="ai-input-wrapper">
        <input type="text" class="ai-input" id="typingInput1" placeholder="How is my sleep affected by pasta?">
        <button class="submit-btn" aria-label="Submit">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
        </button>
    </div>
    @if(isThinking){
        <div class="thinking-wrapper">
            <div class="loader-wrapper">
                <div class="letter-wrapper">
                    <span class="loader-letter">T</span>
                    <span class="loader-letter">h</span>
                    <span class="loader-letter">i</span>
                    <span class="loader-letter">n</span>
                    <span class="loader-letter">k</span>
                    <span class="loader-letter">i</span>
                    <span class="loader-letter">n</span>
                    <span class="loader-letter">g</span>
                </div>
            </div>
        </div>
    }
</section>
