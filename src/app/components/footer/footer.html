<footer class="footer-wrapper">
  
  <!-- HERO SECTION (No Changes here) -->
  <div class="hero-section">
    <div class="hero-content">
      <h1 class="headline">
        Decode your diet.<br>
        Predict your sleep.
      </h1>
      <p class="sub-headline">True health starts here.</p>

      <div class="input-container">
        <input type="email" placeholder="Enter your email" class="email-input" #emailInput>
        <button class="join-btn" (click)="submitEmail(emailInput.value)">Join Us</button>
      </div>
    </div>
    <div class="fade-overlay"></div>
  </div>

  <!-- FOOTER LINKS SECTION -->
  <div class="footer-links-area">
    
    <!-- 1. The Container keeps the links constrained to the middle (optional, or you can make this fluid too) -->
    <div class="container">
      <div class="links-grid">
        <div class="link-column">
          <p>Platform</p>
          <a href="#">Overview</a>
          <a href="#">Features</a>
          <a href="#">Pricing</a>
        </div>
        
        <div class="link-column">
          <p>Company</p>
          <a href="#">About</a>
          <a href="#">Careers</a>
          <a href="#">Blog</a>
        </div>
        
        <div class="link-column">
          <p>Legal</p>
          <a href="#">Terms</a>
          <a href="#">Privacy</a>
          <a href="#">Cookies</a>
        </div>
        
        <div class="link-column">
          <p>Follow Us</p>
          <a href="#">Twitter</a>
          <a href="#">LinkedIn</a>
          <a href="#">Instagram</a>
        </div>
      </div>
    </div> <!-- END CONTAINER HERE -->

    <!-- 2. Bottom Bar is now OUTSIDE the container to span full width -->
    <div class="bottom-bar">
      <div class="company-logo">
        <!-- Ensure correct path to your logo -->
        <img src="../../../assets/svg_icons/Logo white.svg" alt="Logo">
        <span>Endurance</span>
      </div>
      <div class="copyright">
        &copy; 2024 Endurance Inc. All rights reserved.
      </div>
    </div>

  </div>
</footer>
